
id: gr_bluetooth_multi_hopper
label: Bluetooth Multi Hopper
category: '[Bluetooth]'

parameters:
-   id: sample_rate
    label: sample_rate
    dtype: int
-   id: center_freq
    label: center_freq
    dtype: int
-   id: squelch_threshold
    label: squelch_threshold
    dtype: int
-   id: LAP
    label: LAP
    dtype: int
-   id: aliased
    label: aliased
    dtype: bool
-   id: tun
    label: tun
    dtype: int
-   id: pcapng_filename
    label: pcapng_filename
    dtype: string
    default: ''
    hide: part

inputs:
-   domain: stream
    dtype: complex

templates:
    imports: from gnuradio import bluetooth
    make: bluetooth.multi_hopper(${sample_rate}, ${center_freq}, ${squelch_threshold},
        ${LAP}, ${aliased}, ${tun}, ${pcapng_filename} if ${pcapng_filename} else None)

file_format: 1
